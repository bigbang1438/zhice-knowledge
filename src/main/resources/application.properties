spring.application.name=zhice
server.address=127.0.0.1
server.port=8093
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
server.tomcat.max-http-form-post-size=8KB
spring.datasource.url=jdbc:h2:file:./.runtime/db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=0
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
zhice.demo-password=${ZHICE_DEMO_PASSWORD:}
zhice.ollama-url=${ZHICE_OLLAMA_URL:http://127.0.0.1:11435}
zhice.chat-model=${ZHICE_CHAT_MODEL:}
zhice.embed-model=${ZHICE_EMBED_MODEL:}
